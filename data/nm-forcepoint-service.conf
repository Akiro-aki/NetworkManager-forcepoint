<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own_prefix="org.freedesktop.NetworkManager.forcepoint"/>
    <allow send_destination="org.freedesktop.NetworkManager.forcepoint"/>
  </policy>
  <policy context="default">
    <deny own_prefix="org.freedesktop.NetworkManager.forcepoint"/>
    <deny send_destination="org.freedesktop.NetworkManager.forcepoint"/>
  </policy>
</busconfig>
